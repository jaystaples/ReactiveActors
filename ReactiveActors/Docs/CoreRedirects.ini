; Reactive Actors rename (was Composable Game Actions).
; Paste everything below into your project's Config/DefaultEngine.ini, replacing any earlier
; ComposableGameActions / GameActionPreset redirect lines. Keep it until every asset and level has been re-saved.

[CoreRedirects]
; Modules and content folder
+PackageRedirects=(OldName="/Script/ComposableGameActions",NewName="/Script/ReactiveActors")
+PackageRedirects=(OldName="/Script/ComposableGameActionsEditor",NewName="/Script/ReactiveActorsEditor")
+PackageRedirects=(OldName="/ComposableGameActions/",NewName="/ReactiveActors/",MatchSubstring=true)

; Classes
+ClassRedirects=(OldName="/Script/ComposableGameActions.ComposableGameActionObjectBase",NewName="/Script/ReactiveActors.ReactiveObjectBase")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameAction",NewName="/Script/ReactiveActors.ReactiveAction")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionBranch",NewName="/Script/ReactiveActors.ACT_Branch")
+ClassRedirects=(OldName="/Script/ReactiveActors.ReactiveBranch",NewName="/Script/ReactiveActors.ACT_Branch")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionRequirement",NewName="/Script/ReactiveActors.ReactiveRequirement")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionBehavior",NewName="/Script/ReactiveActors.ReactiveRule")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionTrigger",NewName="/Script/ReactiveActors.ReactiveTrigger")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionComponent",NewName="/Script/ReactiveActors.ReactionComponent")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionPreset",NewName="/Script/ReactiveActors.ReactionPreset")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionProtocolData",NewName="/Script/ReactiveActors.ReactionPreset")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionSubsystem",NewName="/Script/ReactiveActors.ReactionSubsystem")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionLibrary",NewName="/Script/ReactiveActors.ReactiveActorsLibrary")
+ClassRedirects=(OldName="/Script/ComposableGameActions.GameActionOneShot",NewName="/Script/ReactiveActors.ReactionOneShot")
+ClassRedirects=(OldName="/Script/ComposableGameActions.ACT_BroadcastGameAction",NewName="/Script/ReactiveActors.ACT_BroadcastEvent")
+ClassRedirects=(OldName="/Script/ComposableGameActions.ACT_CancelProtocol",NewName="/Script/ReactiveActors.ACT_StopReaction")
+ClassRedirects=(OldName="/Script/ReactiveActors.ACT_CancelReaction",NewName="/Script/ReactiveActors.ACT_StopReaction")
+ClassRedirects=(OldName="/Script/ComposableGameActions.BHVR_MaxActivations",NewName="/Script/ReactiveActors.RULE_MaxActivations")
+ClassRedirects=(OldName="/Script/ComposableGameActions.BHVR_Cooldown",NewName="/Script/ReactiveActors.RULE_Cooldown")

; Run Action node moved to its own module (also in the plugin's Config/DefaultReactiveActors.ini, so this line is optional)
+ClassRedirects=(OldName="/Script/ReactiveActorsEditor.K2Node_RunReactiveAction",NewName="/Script/ReactiveActorsNodes.K2Node_RunReactiveAction")

; Structs
+StructRedirects=(OldName="/Script/ComposableGameActions.GameActionProtocol",NewName="/Script/ReactiveActors.Reaction")
+StructRedirects=(OldName="/Script/ComposableGameActions.GameActionContext",NewName="/Script/ReactiveActors.ReactionContext")
+StructRedirects=(OldName="/Script/ComposableGameActions.GameActionSequence",NewName="/Script/ReactiveActors.ActionRunner")

; Enums (three scope enums merged into one)
+EnumRedirects=(OldName="/Script/ComposableGameActions.EGameActionRetrigger",NewName="/Script/ReactiveActors.EReactiveRetriggerPolicy")
+EnumRedirects=(OldName="/Script/ComposableGameActions.EGameActionTriggerScope",NewName="/Script/ReactiveActors.EReactiveScopePolicy")
+EnumRedirects=(OldName="/Script/ComposableGameActions.EGameActionBroadcastScope",NewName="/Script/ReactiveActors.EReactiveScopePolicy",ValueChanges=(("OwningActor","Self")))
+EnumRedirects=(OldName="/Script/ComposableGameActions.EGameActionListenScope",NewName="/Script/ReactiveActors.EReactiveScopePolicy",ValueChanges=(("ThisActor","Self")))
+EnumRedirects=(OldName="/Script/ComposableGameActions.EGameActionRequirementSubject",NewName="/Script/ReactiveActors.EReactiveRequirementSubject")
+EnumRedirects=(OldName="/Script/ComposableGameActions.EGameActionEvaluateMode",NewName="/Script/ReactiveActors.EReactiveBranchMode")

; Properties (named by their new owner, which is how Unreal looks them up)
+PropertyRedirects=(OldName="/Script/ReactiveActors.ReactionComponent.Protocols",NewName="/Script/ReactiveActors.ReactionComponent.Reactions")
+PropertyRedirects=(OldName="/Script/ReactiveActors.ReactionComponent.Data",NewName="/Script/ReactiveActors.ReactionComponent.Preset")
+PropertyRedirects=(OldName="/Script/ReactiveActors.ReactionComponent.OnProtocolTriggered",NewName="/Script/ReactiveActors.ReactionComponent.OnReactionStarted")
+PropertyRedirects=(OldName="/Script/ReactiveActors.ReactionComponent.OnProtocolFinished",NewName="/Script/ReactiveActors.ReactionComponent.OnReactionFinished")
+PropertyRedirects=(OldName="/Script/ReactiveActors.ReactionPreset.Protocols",NewName="/Script/ReactiveActors.ReactionPreset.Reactions")
+PropertyRedirects=(OldName="/Script/ReactiveActors.Reaction.Behaviors",NewName="/Script/ReactiveActors.Reaction.Rules")
+PropertyRedirects=(OldName="/Script/ReactiveActors.ReactiveTrigger.Behaviors",NewName="/Script/ReactiveActors.ReactiveTrigger.Rules")
+PropertyRedirects=(OldName="/Script/ReactiveActors.ReactionSubsystem.OnGameActionBroadcast",NewName="/Script/ReactiveActors.ReactionSubsystem.OnEventBroadcast")

; Functions (Blueprint nodes)
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactionComponent.ExecuteActions",NewName="/Script/ReactiveActors.ReactionComponent.ReactTo")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactionComponent.CancelProtocols",NewName="/Script/ReactiveActors.ReactionComponent.CancelReactions")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactionComponent.ResetProtocols",NewName="/Script/ReactiveActors.ReactionComponent.ResetReactions")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveAction.GetTriggerEvent",NewName="/Script/ReactiveActors.ReactiveAction.GetEvent")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactionSubsystem.BroadcastGameAction",NewName="/Script/ReactiveActors.ReactionSubsystem.BroadcastEvent")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactionSubsystem.SetGameActionsSuspended",NewName="/Script/ReactiveActors.ReactionSubsystem.SetEventsSuspended")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactionSubsystem.AreGameActionsSuspended",NewName="/Script/ReactiveActors.ReactionSubsystem.AreEventsSuspended")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactionSubsystem.CancelAllProtocols",NewName="/Script/ReactiveActors.ReactionSubsystem.CancelAllReactions")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.BroadcastGameAction",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.BroadcastEvent")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.SuspendGameActions",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.SuspendEvents")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.ResumeGameActions",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.ResumeEvents")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.AreGameActionsSuspended",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.AreEventsSuspended")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.BroadcastToActor",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.BroadcastEventToActor")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.BroadcastToIdentity",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.BroadcastEventToIdentity")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.RunProtocol",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.RunReaction")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllProtocols",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllReactions")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllProtocols",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllReactions")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllProtocolsForActor",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllReactionsForActor")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllProtocolsForActor",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllReactionsForActor")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllProtocolsForIdentity",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllReactionsForIdentity")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllProtocolsForIdentity",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllReactionsForIdentity")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllProtocolsForEvent",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.CancelAllReactionsForEvent")
+FunctionRedirects=(OldName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllProtocolsForEvent",NewName="/Script/ReactiveActors.ReactiveActorsLibrary.ResetAllReactionsForEvent")

; Demo gameplay tags: these go in Config/DefaultGameplayTags.ini instead, under
; [/Script/GameplayTags.GameplayTagsSettings]
;   +GameplayTagRedirects=(OldTagName="zGameAction.Interact",NewTagName="zReaction.Interact")
;   +GameplayTagRedirects=(OldTagName="zGameAction.Interact.Enter",NewTagName="zReaction.Interact.Enter")
