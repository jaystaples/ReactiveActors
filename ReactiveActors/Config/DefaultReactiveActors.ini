; Reactive Actors plugin config, read automatically while the plugin is enabled.

[CoreRedirects]
; The Run Action node moved from the editor module to the ReactiveActorsNodes module
+ClassRedirects=(OldName="/Script/ReactiveActorsEditor.K2Node_RunReactiveAction",NewName="/Script/ReactiveActorsNodes.K2Node_RunReactiveAction")

; Spawn VFX and Set Data Layer State moved to the Reactive Actors Extras plugin (enable it to keep using them)
+ClassRedirects=(OldName="/Script/ReactiveActors.ACT_SpawnVFX",NewName="/Script/ReactiveActorsExtras.ACT_SpawnVFX")
+ClassRedirects=(OldName="/Script/ReactiveActors.ACT_SetDataLayerState",NewName="/Script/ReactiveActorsExtras.ACT_SetDataLayerState")

; Set Actor Hidden: the Hidden tick box became Change (Hide / Show / Toggle); old values are read once on load
+PropertyRedirects=(OldName="/Script/ReactiveActors.ACT_SetActorHidden.bHidden",NewName="/Script/ReactiveActors.ACT_SetActorHidden.bHidden_DEPRECATED")
