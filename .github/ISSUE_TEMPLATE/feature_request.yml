name: Feature request
description: An idea for something Reactive Actors could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation in your game, not only the feature. There may already be a way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, from a designer's point of view.
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today?
      description: Any workaround you're using now.
